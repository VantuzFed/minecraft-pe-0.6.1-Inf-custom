<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MCPE 0.6.1</title>
  <script src="coi-serviceworker.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    #error-banner {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px 16px;
      background: rgba(180, 0, 0, 0.9);
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      border-radius: 6px;
      z-index: 10000;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #mobile-text-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      border: none;
      margin: 0;
      padding: 0;
      font-size: 16px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="error-banner"></div>
<canvas id="canvas"></canvas>
<input id="mobile-text-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<script>
  function showError(msg) {
    var b = document.getElementById('error-banner');
    if (b) {
      b.style.display = 'block';
      b.textContent = 'MCPE Error: ' + msg;
    }
  }

  window.addEventListener('error', function(e) {
    showError(e.message || (e.error && e.error.message) || String(e));
  });

  window.addEventListener('unhandledrejection', function(e) {
    showError('Unhandled rejection: ' + (e.reason ? (e.reason.message || e.reason) : e));
  });

  var Module = {
    canvas: document.getElementById('canvas'),
    onRuntimeInitialized: function () {
      resizeCanvas();
    },
    onAbort: function(what) {
      showError('Runtime aborted: ' + what);
    }
  };

  function resizeCanvas() {
    const canvas = Module.canvas;
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function () {
    setTimeout(resizeCanvas, 100);
  });

  function saveStorage() {
    if (typeof FS !== 'undefined' && FS.syncfs) {
      FS.syncfs(false, function (err) {
        if (err) console.log('Sync FS failed: ' + err);
      });
    }
  }
  window.addEventListener('beforeunload', saveStorage);
  window.addEventListener('pagehide', saveStorage);

  // Fullscreen support
  window.requestWebFullscreen = function() {
    var elem = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(function(err) {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }
  };

  var hasTriggeredFullscreen = false;
  function triggerFullscreenOnFirstGesture() {
    if (!hasTriggeredFullscreen) {
      window.requestWebFullscreen();
      hasTriggeredFullscreen = true;
    }
  }
  document.addEventListener('touchend', triggerFullscreenOnFirstGesture, { passive: true });
  document.addEventListener('click', triggerFullscreenOnFirstGesture, { passive: true });

  // Virtual keyboard support
  var mobInput = document.getElementById('mobile-text-input');
  var prevInputValue = ' ';
  if (mobInput) mobInput.value = ' ';

  window.showVirtualKeyboard = function() {
    if (!mobInput) return;
    mobInput.style.pointerEvents = 'auto';
    mobInput.value = ' ';
    prevInputValue = ' ';
    mobInput.focus();
  };

  window.hideVirtualKeyboard = function() {
    if (!mobInput) return;
    mobInput.blur();
    mobInput.style.pointerEvents = 'none';
  };

  function processMobileInput() {
    if (!mobInput) return;
    var cur = mobInput.value;
    if (cur === prevInputValue) return;

    if (cur.length < prevInputValue.length) {
      var diff = prevInputValue.length - cur.length;
      for (var i = 0; i < diff; i++) {
        if (Module._web_feed_key) {
          Module._web_feed_key(8, 1);
          Module._web_feed_key(8, 0);
        }
      }
    } else {
      var added = '';
      if (prevInputValue === ' ' && cur.startsWith(' ')) {
        added = cur.substring(1);
      } else if (prevInputValue === ' ') {
        added = cur;
      } else {
        added = cur.slice(prevInputValue.length);
      }
      for (var j = 0; j < added.length; j++) {
        var code = added.codePointAt(j);
        if (Module._web_feed_char) {
          Module._web_feed_char(code);
        }
      }
    }
    mobInput.value = ' ';
    prevInputValue = ' ';
  }

  if (mobInput) {
    mobInput.addEventListener('input', processMobileInput);
    mobInput.addEventListener('compositionend', processMobileInput);
    mobInput.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' || e.keyCode === 8) {
        if (mobInput.value === '' || mobInput.value === ' ') {
          if (Module._web_feed_key) {
            Module._web_feed_key(8, 1);
            Module._web_feed_key(8, 0);
          }
          mobInput.value = ' ';
          prevInputValue = ' ';
          e.preventDefault();
        }
      } else if (e.key === 'Enter' || e.keyCode === 13) {
        if (Module._web_feed_key) {
          Module._web_feed_key(13, 1);
          Module._web_feed_key(13, 0);
        }
        mobInput.blur();
        e.preventDefault();
      }
    });
  }
</script>

<script src="MinecraftPE.js"></script>
</body>
</html>
