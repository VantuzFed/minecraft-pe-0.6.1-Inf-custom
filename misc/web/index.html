<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MCPE 0.6.1</title>
  <script src="coi-serviceworker.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #151515;
      background: radial-gradient(circle at center, #2b2b2b 0%, #111111 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #fff;
      transition: opacity 0.4s ease-out;
    }

    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 90vw;
      width: 360px;
    }

    .mc-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #dfdfdf;
      text-shadow: 2px 2px 0px #000, 4px 4px 0px #383838;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .mc-subtitle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #55ff55;
      text-shadow: 1px 1px 0px #000;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .progress-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #loading-bar-track {
      width: 100%;
      height: 20px;
      background: #181818;
      border: 2px solid #5a5a5a;
      box-shadow: inset 0 0 6px #000;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    #loading-bar-fill {
      width: 0%;
      height: 100%;
      background: #4ba236;
      background: linear-gradient(180deg, #6dd454 0%, #3a8528 100%);
      transition: width 0.15s ease-out;
    }

    #loading-status-text {
      font-size: 13px;
      color: #cccccc;
      text-shadow: 1px 1px 0px #000;
      min-height: 18px;
    }

    .loading-tip {
      margin-top: 24px;
      font-size: 11px;
      color: #777777;
      line-height: 1.4;
    }

    #mobile-text-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      border: none;
      margin: 0;
      padding: 0;
      font-size: 16px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-container">
    <div class="mc-title">Minecraft</div>
    <div class="mc-subtitle">Pocket Edition</div>
    <div class="progress-box">
      <div id="loading-bar-track">
        <div id="loading-bar-fill"></div>
      </div>
      <div id="loading-status-text">Инициализация...</div>
    </div>
    <div class="loading-tip">Первый запуск скачивает компоненты игры. Пожалуйста, подождите...</div>
  </div>
</div>

<canvas id="canvas"></canvas>
<input id="mobile-text-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<script>
  var loadingOverlay = document.getElementById('loading-overlay');
  var loadingBar = document.getElementById('loading-bar-fill');
  var loadingStatus = document.getElementById('loading-status-text');

  function updateProgress(percent, text) {
    if (loadingBar && percent !== null && percent !== undefined) {
      loadingBar.style.width = Math.min(100, Math.max(0, percent)) + '%';
    }
    if (loadingStatus && text) {
      loadingStatus.textContent = text;
    }
  }

  function hideLoadingOverlay() {
    if (loadingOverlay && !loadingOverlay.classList.contains('fade-out')) {
      loadingOverlay.classList.add('fade-out');
      setTimeout(function() {
        loadingOverlay.style.display = 'none';
      }, 450);
    }
  }

  window.onFirstGameFrame = function() {
    updateProgress(100, 'Готово!');
    setTimeout(hideLoadingOverlay, 50);
  };

  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function(text) {
      if (!text) return;
      var match = text.match(/([0-9]+)\/([0-9]+)/);
      if (match) {
        var cur = parseInt(match[1]);
        var total = parseInt(match[2]);
        if (total > 0) {
          var pct = Math.round((cur / total) * 100);
          var curMb = (cur / (1024 * 1024)).toFixed(1);
          var totalMb = (total / (1024 * 1024)).toFixed(1);
          updateProgress(pct, 'Загрузка ресурсов: ' + pct + '% (' + curMb + ' / ' + totalMb + ' MB)');
        }
      } else if (text.indexOf('Preparing') !== -1) {
        updateProgress(90, 'Компиляция WebAssembly...');
      } else {
        updateProgress(null, text);
      }
    },
    totalDependencies: 0,
    monitorRunDependencies: function(left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      if (left > 0) {
        var pct = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 85);
        updateProgress(pct, 'Загрузка данных (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...');
      }
    },
    onRuntimeInitialized: function () {
      resizeCanvas();
      updateProgress(96, 'Запуск игры...');
      setTimeout(hideLoadingOverlay, 2500);
    }
  };

  function resizeCanvas() {
    const canvas = Module.canvas;
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function () {
    setTimeout(resizeCanvas, 100);
  });

  function saveStorage() {
    if (typeof FS !== 'undefined' && FS.syncfs) {
      FS.syncfs(false, function (err) {
        if (err) console.log('Sync FS failed: ' + err);
      });
    }
  }
  window.addEventListener('beforeunload', saveStorage);
  window.addEventListener('pagehide', saveStorage);

  // Fullscreen support
  window.requestWebFullscreen = function() {
    var elem = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(function(err) {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }
  };

  // Enter fullscreen on first user touch/click gesture (nickname stage)
  var hasTriggeredFullscreen = false;
  function triggerFullscreenOnFirstGesture() {
    if (!hasTriggeredFullscreen) {
      window.requestWebFullscreen();
      hasTriggeredFullscreen = true;
    }
  }
  document.addEventListener('touchend', triggerFullscreenOnFirstGesture, { passive: true });
  document.addEventListener('click', triggerFullscreenOnFirstGesture, { passive: true });

  // Virtual keyboard support
  var mobInput = document.getElementById('mobile-text-input');
  var prevInputValue = ' ';
  if (mobInput) mobInput.value = ' ';

  window.showVirtualKeyboard = function() {
    if (!mobInput) return;
    mobInput.style.pointerEvents = 'auto';
    mobInput.value = ' ';
    prevInputValue = ' ';
    mobInput.focus();
  };

  window.hideVirtualKeyboard = function() {
    if (!mobInput) return;
    mobInput.blur();
    mobInput.style.pointerEvents = 'none';
  };

  function processMobileInput() {
    if (!mobInput) return;
    var cur = mobInput.value;
    if (cur === prevInputValue) return;

    if (cur.length < prevInputValue.length) {
      // Backspace
      var diff = prevInputValue.length - cur.length;
      for (var i = 0; i < diff; i++) {
        if (Module._web_feed_key) {
          Module._web_feed_key(8, 1);
          Module._web_feed_key(8, 0);
        }
      }
    } else {
      // Added characters
      var added = '';
      if (prevInputValue === ' ' && cur.startsWith(' ')) {
        added = cur.substring(1);
      } else if (prevInputValue === ' ') {
        added = cur;
      } else {
        added = cur.slice(prevInputValue.length);
      }
      for (var j = 0; j < added.length; j++) {
        var code = added.codePointAt(j);
        if (Module._web_feed_char) {
          Module._web_feed_char(code);
        }
      }
    }
    mobInput.value = ' ';
    prevInputValue = ' ';
  }

  if (mobInput) {
    mobInput.addEventListener('input', processMobileInput);
    mobInput.addEventListener('compositionend', processMobileInput);
    mobInput.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' || e.keyCode === 8) {
        if (mobInput.value === '' || mobInput.value === ' ') {
          if (Module._web_feed_key) {
            Module._web_feed_key(8, 1);
            Module._web_feed_key(8, 0);
          }
          mobInput.value = ' ';
          prevInputValue = ' ';
          e.preventDefault();
        }
      } else if (e.key === 'Enter' || e.keyCode === 13) {
        if (Module._web_feed_key) {
          Module._web_feed_key(13, 1);
          Module._web_feed_key(13, 0);
        }
        mobInput.blur();
        e.preventDefault();
      }
    });
  }

  // Load MinecraftPE script safely (avoid double download during Service Worker reload)
  function loadGameScript() {
    var script = document.createElement('script');
    script.src = 'MinecraftPE.js';
    script.async = true;
    document.body.appendChild(script);
  }

  if (window.crossOriginIsolated === false && window.isSecureContext && ('serviceWorker' in navigator)) {
    updateProgress(10, 'Настройка защищенного окружения...');
  } else {
    updateProgress(15, 'Подготовка к загрузке...');
    loadGameScript();
  }
</script>

</body>
</html>
