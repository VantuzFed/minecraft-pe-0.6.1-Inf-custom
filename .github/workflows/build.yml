name: Build Game

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"              # every branch
      - "!no-build-**"    # unless marked as no-build

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: linux
          target: linux

      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ninja-build libgl-dev libwayland-dev xorg-dev libxkbcommon-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: |
          cmake --build . --config $BUILD_TYPE --target MinecraftPE --parallel
          cmake --build . --config $BUILD_TYPE --target MinecraftPE-server --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-linux
          path: |
            ${{ github.workspace }}/build/MinecraftPE
            ${{ github.workspace }}/build/MinecraftPE-server

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: mac
          target: mac

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{ github.workspace }}/build
        run: |
          cmake --build . --config $BUILD_TYPE --target MinecraftPE --parallel
          cmake --build . --config $BUILD_TYPE --target MinecraftPE-server --parallel

      - name: Prepare macOS Artifacts
        working-directory: ${{ github.workspace }}/build
        run: |
          mkdir -p dist
          cp MinecraftPE dist/
          cp MinecraftPE-server dist/
          find _deps -name "*.dylib" -exec cp {} dist/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-macos
          path: ${{ github.workspace }}/build/dist/

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: linux
          target: linux

      - name: Setup Ninja
        uses: ./.github/actions/setup-ninja
        with:
          host: linux

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: 'emsdk-cache'

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -G Ninja -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/emsdk-cache/emsdk-main/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"

      - name: Build
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --config $BUILD_TYPE --target MinecraftPE --parallel

      - name: Prepare Web Dist
        working-directory: ${{ github.workspace }}/build
        run: |
          mkdir -p dist
          cp index.html MinecraftPE.js MinecraftPE.wasm MinecraftPE.data dist/
          [ -f MinecraftPE.worker.js ] && cp MinecraftPE.worker.js dist/ || true
          [ -f coi-serviceworker.js ] && cp coi-serviceworker.js dist/ || true
          [ -f ${{ github.workspace }}/CNAME ] && cp ${{ github.workspace }}/CNAME dist/ || true
          touch dist/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-web
          path: ${{ github.workspace }}/build/dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/build/dist
          publish_branch: gh-pages
          cname: pe.vantuzfed.ru

  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]

    env:
      ANDROID_NDK_PATH: ${{ github.workspace }}/android-ndk-r14b
      ADB: /bin/true
      MATRIX_ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libncurses6 libtinfo6
          for f in /usr/lib/x86_64-linux-gnu/libncurses.so.6* /lib/x86_64-linux-gnu/libncurses.so.6*; do
            if [ -f "$f" ]; then
              sudo ln -sf "$f" /usr/lib/x86_64-linux-gnu/libncurses.so.5
              sudo ln -sf "$f" /lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
              break
            fi
          done
          for f in /usr/lib/x86_64-linux-gnu/libtinfo.so.6* /lib/x86_64-linux-gnu/libtinfo.so.6*; do
            if [ -f "$f" ]; then
              sudo ln -sf "$f" /usr/lib/x86_64-linux-gnu/libtinfo.so.5
              sudo ln -sf "$f" /lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
              break
            fi
          done
          sudo ldconfig

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android NDK r14b
        id: cache-android-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r14b
          key: android-ndk-r14b-v1

      - name: Install Android NDK r14b
        if: steps.cache-android-ndk.outputs.cache-hit != 'true'
        run: |
          curl -L -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip"
          unzip -q ndk.zip -d "${{ github.workspace }}"
          rm -f ndk.zip

      - name: Verify Android Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"
          "$ANDROID_NDK_PATH/ndk-build" --version

      - name: Build Android APK
        run: |
          chmod +x ./build.sh
          ./build.sh --abi ${{ matrix.abi }} --no-install

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-android-${{ matrix.abi }}
          path: ${{ github.workspace }}/build-apk/minecraftpe-*-debug.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup caches
        uses: ./.github/actions/setup-cache
        with:
          host: win
          target: win

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        working-directory: ${{ github.workspace }}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --config $BUILD_TYPE --target MinecraftPE --parallel

      - name: Prepare Windows Dist
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: |
          mkdir -p dist
          find . -name "MinecraftPE.exe" -exec cp {} dist/ \;
          find . -name "*.dll" -exec cp {} dist/ \; || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-windows
          path: ${{ github.workspace }}/build/dist/

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ build-linux, build-macos, build-web, build-android, build-windows ]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare Version Variables
        id: ref
        run: |
          if [ -f VERSION ]; then
            echo "version=$(cat VERSION | xargs)" >> $GITHUB_OUTPUT
          else
            echo "version=0.6.1" >> $GITHUB_OUTPUT
          fi
          echo "hash=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Zip Linux Client
        uses: vimtor/action-zip@v1.2
        with:
          files: mcpe-linux/MinecraftPE
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-linux.zip

      - name: Zip Linux Server
        uses: vimtor/action-zip@v1.2
        with:
          files: mcpe-linux/MinecraftPE-server
          dest: minecraftpe-server-${{ steps.ref.outputs.hash }}-linux.zip

      - name: Zip macOS Artifacts
        uses: vimtor/action-zip@v1.2
        with:
          files: mcpe-macos/
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-macos.zip

      - name: Zip Web Artifacts
        uses: vimtor/action-zip@v1.2
        with:
          files: mcpe-web/
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-web.zip

      - name: Zip Windows Artifacts
        uses: vimtor/action-zip@v1.2
        with:
          files: mcpe-windows/
          dest: minecraftpe-${{ steps.ref.outputs.hash }}-windows.zip

      - name: Zip Data
        uses: vimtor/action-zip@v1.2
        with:
          files: data
          recursive: true
          dest: data.zip

      - name: Prepare Android Artifacts
        run: |
          if [ -f mcpe-android-arm64-v8a/minecraftpe-v8a-debug.apk ]; then
            cp mcpe-android-arm64-v8a/minecraftpe-v8a-debug.apk minecraftpe-${{ steps.ref.outputs.hash }}-android-arm64-v8a.apk
          fi
          if [ -f mcpe-android-armeabi-v7a/minecraftpe-v7a-debug.apk ]; then
            cp mcpe-android-armeabi-v7a/minecraftpe-v7a-debug.apk minecraftpe-${{ steps.ref.outputs.hash }}-android-armeabi-v7a.apk
          fi

      - name: Update Development Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: "Development Release"
          body: |
            MinecraftPE development release for commit ${{ github.sha }}.
          files: |
            ./data.zip
            ./minecraftpe-server-${{ steps.ref.outputs.hash }}-linux.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-linux.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-macos.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-windows.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-web.zip
            ./minecraftpe-${{ steps.ref.outputs.hash }}-android-arm64-v8a.apk
            ./minecraftpe-${{ steps.ref.outputs.hash }}-android-armeabi-v7a.apk
